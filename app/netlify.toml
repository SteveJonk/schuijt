[build]
  # Netlify's Next.js runtime serves from .next; publishing the app root itself
  # (the UI default here) deploys raw source files, so every route 404s.
  publish = ".next"

# NEXT_PUBLIC_* values ship in the browser bundle by design and are short,
# common strings ("production"), so the scanner flags them in source files.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_SANITY_DATASET"
